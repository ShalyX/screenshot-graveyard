services:
  - type: web
    name: screenshot-graveyard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        value: google/gemma-3-4b-it:deepinfra
      - key: PYTHON_VERSION
        value: 3.13.7
